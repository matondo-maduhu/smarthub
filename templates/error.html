{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}{{ title }} · {{ app_name }}{% endblock %}

{% block content %}
<section class="card guest">
  <div class="avatar big">{{ icon('shield', 32) }}</div>
  <h2>{{ title }}</h2>
  <p class="muted">{{ message }}</p>
  <a class="btn primary" href="{{ url_for('home') }}">{{ icon('home', 18) }} Rudi nyumbani</a>
</section>
{% endblock %}
